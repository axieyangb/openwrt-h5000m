name: Build H5000M Firmware

on:
  push:
    branches: [ h5000m-custom ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: h5000m-custom
        fetch-depth: 1

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get autoremove -y >/dev/null
        df -h

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential clang flex bison g++ gawk gcc-multilib \
          gettext git libncurses-dev libssl-dev python3-distutils \
          rsync unzip zlib1g-dev file wget ccache

    - name: Cache staging dir
      uses: actions/cache@v4
      with:
        path: |
          staging_dir/host
          staging_dir/hostpkg
          build_dir/host
          build_dir/hostpkg
        key: staging-h5000m-${{ hashFiles('feeds.conf.default') }}
        restore-keys: staging-h5000m-

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-h5000m-${{ github.sha }}
        restore-keys: ccache-h5000m-

    - name: Update and install feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Write .config
      run: |
        printf "%s\n" \
          "CONFIG_TARGET_mediatek=y" \
          "CONFIG_TARGET_mediatek_filogic=y" \
          "CONFIG_TARGET_mediatek_filogic_DEVICE_hiveton_h5000m=y" \
          "" \
          "# LuCI" \
          "CONFIG_PACKAGE_luci=y" \
          "CONFIG_PACKAGE_luci-app-firewall=y" \
          "CONFIG_PACKAGE_luci-app-opkg=y" \
          "CONFIG_PACKAGE_luci-theme-bootstrap=y" \
          "" \
          "# Hardware NAT acceleration (line-rate 2.5G NAT offload)" \
          "CONFIG_PACKAGE_kmod-mediatek_hnat=y" \
          "" \
          "# Fan control" \
          "CONFIG_PACKAGE_kmod-hwmon-pwmfan=y" \
          "CONFIG_PACKAGE_kmod-hwmon-core=y" \
          "" \
          "# WiFi (mt76 open-source driver, MT7992 HE/WiFi6 mode)" \
          "CONFIG_PACKAGE_kmod-mt76=y" \
          "CONFIG_PACKAGE_kmod-mt76-core=y" \
          "CONFIG_PACKAGE_kmod-mt76-connac=y" \
          "CONFIG_PACKAGE_kmod-mt7996e=y" \
          "" \
          "# 5G modem - Quectel RM520N-GL" \
          "CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y" \
          "CONFIG_PACKAGE_kmod-usb-serial-option=y" \
          "CONFIG_PACKAGE_uqmi=y" \
          "CONFIG_PACKAGE_libqmi=y" \
          "CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y" \
          "CONFIG_PACKAGE_umbim=y" \
          "" \
          "# WireGuard VPN" \
          "CONFIG_PACKAGE_kmod-wireguard=y" \
          "CONFIG_PACKAGE_wireguard-tools=y" \
          "CONFIG_PACKAGE_luci-app-wireguard=y" \
          "CONFIG_PACKAGE_luci-proto-wireguard=y" \
          "" \
          "# eMMC filesystem tools" \
          "CONFIG_PACKAGE_f2fsck=y" \
          "CONFIG_PACKAGE_mkf2fs=y" \
          "" \
          "# Utilities" \
          "CONFIG_PACKAGE_htop=y" \
          "CONFIG_PACKAGE_tcpdump=y" \
          "CONFIG_PACKAGE_kmod-usb3=y" \
          > .config
        make defconfig

    - name: Download sources
      run: make download -j$(nproc) V=s 2>&1 | grep -E "^(ERROR|WARNING)" || true

    - name: Build firmware
      run: make -j$(nproc) V=s 2>&1 | tee /tmp/build.log || make -j1 V=sc 2>&1 | tee /tmp/build.log

    - name: List artifacts
      if: always()
      run: find bin/targets/mediatek/filogic/ -type f 2>/dev/null | sort || echo "No output yet"

    - name: Upload firmware
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: h5000m-firmware-${{ github.run_number }}
        path: |
          bin/targets/mediatek/filogic/*hiveton*sysupgrade*
          bin/targets/mediatek/filogic/*hiveton*factory*
          bin/targets/mediatek/filogic/sha256sums
          bin/targets/mediatek/filogic/config.buildinfo
        retention-days: 30
        if-no-files-found: warn

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ github.run_number }}
        path: /tmp/build.log
        retention-days: 7
