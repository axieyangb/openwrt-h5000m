name: Build H5000M Firmware

on:
  push:
    branches: [ h5000m-custom ]
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Clean build (ignore cache)"
        required: false
        default: "false"
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: h5000m-custom
        fetch-depth: 1

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get autoremove -y
        df -h

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential clang flex bison g++ gawk gcc-multilib \
          gettext git libncurses-dev libssl-dev python3-distutils \
          rsync unzip zlib1g-dev file wget ccache

    - name: Setup ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-h5000m-${{ github.sha }}
        restore-keys: ccache-h5000m-

    - name: Cache staging dir
      uses: actions/cache@v4
      if: inputs.clean_build != true
      with:
        path: |
          staging_dir/host
          staging_dir/hostpkg
          build_dir/host
          build_dir/hostpkg
        key: staging-h5000m-${{ hashFiles('feeds.conf.default') }}
        restore-keys: staging-h5000m-

    - name: Update & install feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure for Hiveton H5000M
      run: |
        cat > .config <<'EOF'
CONFIG_TARGET_mediatek=y
CONFIG_TARGET_mediatek_filogic=y
CONFIG_TARGET_mediatek_filogic_DEVICE_hiveton_h5000m=y
# Base system
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-app-firewall=y
CONFIG_PACKAGE_luci-app-opkg=y
CONFIG_PACKAGE_luci-theme-bootstrap=y
# Modem / 5G (RM520N-GL)
CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
CONFIG_PACKAGE_kmod-usb-serial-option=y
CONFIG_PACKAGE_uqmi=y
CONFIG_PACKAGE_libqmi=y
CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
CONFIG_PACKAGE_umbim=y
# WiFi
CONFIG_PACKAGE_kmod-mt76=y
# Utils
CONFIG_PACKAGE_htop=y
CONFIG_PACKAGE_tcpdump=y
EOF
        make defconfig

    - name: Download package sources
      run: make download -j$(nproc) V=s 2>&1 | grep -E "^(ERROR|WARNING|Downloading)" || true

    - name: Build firmware
      run: |
        make -j$(nproc) V=s 2>&1 | tee /tmp/build.log
        echo "Build exit: $?"
      continue-on-error: true

    - name: Retry single-thread on failure
      if: failure()
      run: make -j1 V=s 2>&1 | tee /tmp/build.log

    - name: Collect output
      run: |
        echo "=== Build artifacts ==="
        find bin/targets/mediatek/filogic/ -type f | sort
        ls -lh bin/targets/mediatek/filogic/ 2>/dev/null || echo "No output dir"

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: h5000m-firmware-${{ github.run_number }}
        path: |
          bin/targets/mediatek/filogic/*hiveton*sysupgrade*
          bin/targets/mediatek/filogic/*hiveton*factory*
          bin/targets/mediatek/filogic/sha256sums
          bin/targets/mediatek/filogic/config.buildinfo
          bin/targets/mediatek/filogic/feeds.buildinfo
        retention-days: 30
        if-no-files-found: warn

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ github.run_number }}
        path: /tmp/build.log
        retention-days: 7
